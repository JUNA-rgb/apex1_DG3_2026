<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Sim-Racing - No Manejes. Compite.</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Google Fonts for futuristic/sporty typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo-container">
            <div class="logo-icon">A</div>
            <span class="logo-text">APEX <span class="light-text">SIM-RACING</span></span>
        </div>
        <nav class="nav-links">
            <a href="#inicio">Inicio</a>
            <a href="#academia">Academia</a>
            <a href="#cursos">Cursos</a>
            <a href="#campeonato">Campeonato</a>
            <a href="#premios">Premios</a>
            <a href="#faq">FAQ</a>
        </nav>
        <button class="btn-primary btn-inscribirme">INSCRIBIRME</button>
    </header>

    <!-- Hero Section -->
    <section id="hero" class="hero-section">
        <div class="hero-background-overlay"></div>
        
        <!-- Animated Grid/Network Background Content can be injected via JS or CSS lines -->
        <div class="cyber-grid"></div>

        <div class="hero-content">
            <div class="badge-container">
                <span class="badge-text">ACADEMIA PROFESIONAL DE SIM RACING</span>
            </div>

            <h1 class="hero-title">
                NO <span class="accent-text">MANEJES.</span><br>
                <span class="main-title-bold">COMPITE.</span>
            </h1>

            <p class="hero-subtitle">
                Convertite en piloto profesional de simulación y competí por premios reales.
            </p>

            <div class="hero-cta-group">
                <button class="btn-cyan">COMENZAR MI CARRERA <span class="arrow">→</span></button>
                <button class="btn-outline">CONOCER MÁS</button>
            </div>

            <div class="hero-notice">
                <span class="icon-bolt">⚡</span> Cupos limitados — Temporada 5 abre en 14 días
            </div>

            <div class="scroll-indicator">
                <span class="scroll-text">SCROLL</span>
                <div class="scroll-arrow"></div>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
