<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recuperar contraseña | APEX SIM-RACING Academy</title>
  <meta name="description" content="Restablecé tu contraseña de APEX SIM-RACING Academy."/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body data-page="forgot">

  <div class="page-wrapper">

    <!-- Navbar injected by JS -->

    <main class="auth-section">
      <div class="auth-card">

        <!-- Header -->
        <div class="auth-header">
          <div class="auth-logo">
            <svg class="auth-logo-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="forgotLogoGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#dc2626"/>
                  <stop offset="100%" stop-color="#f97316"/>
                </linearGradient>
              </defs>
              <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="url(#forgotLogoGrad)" stroke-width="1.5"/>
              <path d="M12 30 L20 10 L28 30" fill="none" stroke="url(#forgotLogoGrad)" stroke-width="2.5" stroke-linejoin="round"/>
              <line x1="14.5" y1="23" x2="25.5" y2="23" stroke="url(#forgotLogoGrad)" stroke-width="2"/>
              <line x1="8" y1="20" x2="14" y2="20" stroke="#dc2626" stroke-width="1.5" opacity="0.7"/>
              <line x1="26" y1="20" x2="32" y2="20" stroke="#dc2626" stroke-width="1.5" opacity="0.7"/>
            </svg>
            <div class="auth-logo-text">
              <span class="auth-apex">APEX</span>
              <span class="auth-academy">Sim-Racing Academy</span>
            </div>
          </div>
          <h1 class="auth-title">Recuperar contraseña</h1>
          <p class="auth-subtitle">Ingresá tu email y te enviamos el link de recuperación</p>
        </div>

        <!-- Form -->
        <form class="auth-form" id="forgotForm" novalidate>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="forgotEmail">Email registrado</label>
            <div class="input-wrapper">
              <span class="input-icon" data-icon="email"></span>
              <input
                class="form-input"
                type="email"
                id="forgotEmail"
                name="email"
                placeholder="piloto@apex.com"
                autocomplete="email"
                required
              />
            </div>
            <span class="field-error" role="alert"></span>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary">
            <span class="btn-spinner"></span>
            <span class="btn-label">Enviar instrucciones</span>
          </button>

          <!-- Back -->
          <a href="login.html" class="btn btn-secondary">
            ← Volver al Login
          </a>

        </form>

      </div>
    </main>

    <!-- Footer injected by JS -->

  </div>

  <script src="js/main.js"></script>
</body>
</html>
